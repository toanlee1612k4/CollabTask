name: todolist
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2
  image_picker: ^1.1.2 #thêm thư viện
  drag_and_drop_lists: ^0.4.2
  fl_chart: ^0.69.0
  provider: ^6.1.5+1
  dio: ^5.4.0
  shared_preferences: ^2.2.2
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  percent_indicator: ^4.2.3
  cached_network_image: ^3.3.1
  intl: ^0.20.2
  
  # File handling (NEW - Dec 13)
  file_picker: ^6.1.0
  open_file: ^3.3.0
  path_provider: ^2.1.0
  
  # OAuth (NEW - Dec 13)
  google_sign_in: ^6.2.0
  flutter_facebook_auth: ^6.0.0
  
  # Secure storage for tokens
  flutter_secure_storage: ^9.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4  # 👈 Đưa vào đây, không nằm trong dependencies

flutter:
  uses-material-design: true

  assets:
    - assets/icon/app_icon.png  # 👈 Đảm bảo file icon có trong thư mục này

# 👇 Cấu hình flutter_launcher_icons phải đặt NGANG hàng với flutter:, không lùi vào trong
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
